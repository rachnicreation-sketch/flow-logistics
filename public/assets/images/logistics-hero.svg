<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Hero logistique</title>
  <desc id="desc">Illustration d'un reseau logistique avec camion, entrepot, palettes et flux de livraison.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2238"/>
      <stop offset="55%" stop-color="#134e6f"/>
      <stop offset="100%" stop-color="#15857a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9f4ff" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="truck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="warehouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>

  <circle cx="980" cy="140" r="120" fill="#22d3ee" fill-opacity="0.18"/>
  <circle cx="230" cy="120" r="94" fill="#34d399" fill-opacity="0.2"/>
  <circle cx="1110" cy="500" r="150" fill="#60a5fa" fill-opacity="0.14"/>

  <g opacity="0.85" stroke="#93c5fd" stroke-width="2" stroke-dasharray="7 9" fill="none">
    <path d="M206 180 C 360 90, 530 120, 690 220"/>
    <path d="M690 220 C 790 286, 910 294, 1014 258"/>
    <path d="M705 242 C 776 328, 868 368, 970 394"/>
  </g>

  <g fill="#f8fafc" opacity="0.95">
    <circle cx="206" cy="180" r="10"/>
    <circle cx="690" cy="220" r="10"/>
    <circle cx="1014" cy="258" r="10"/>
    <circle cx="970" cy="394" r="10"/>
  </g>

  <g filter="url(#soft)">
    <rect x="90" y="438" width="1020" height="210" rx="22" fill="url(#card)"/>

    <rect x="140" y="486" width="360" height="126" rx="12" fill="url(#warehouse)"/>
    <polygon points="140,486 320,390 500,486" fill="#bfdbfe"/>
    <rect x="182" y="526" width="66" height="86" rx="8" fill="#f8fafc"/>
    <rect x="272" y="526" width="66" height="86" rx="8" fill="#e0f2fe"/>
    <rect x="362" y="526" width="96" height="86" rx="8" fill="#dbeafe"/>

    <g>
      <rect x="560" y="550" width="356" height="54" rx="12" fill="url(#truck)"/>
      <rect x="732" y="514" width="184" height="80" rx="12" fill="#fb7185"/>
      <rect x="584" y="566" width="70" height="24" rx="6" fill="#fee2e2"/>
      <rect x="750" y="536" width="64" height="34" rx="6" fill="#fde68a"/>
      <rect x="824" y="536" width="70" height="34" rx="6" fill="#fde68a"/>
      <circle cx="646" cy="616" r="24" fill="#0f172a"/>
      <circle cx="646" cy="616" r="10" fill="#cbd5e1"/>
      <circle cx="874" cy="616" r="24" fill="#0f172a"/>
      <circle cx="874" cy="616" r="10" fill="#cbd5e1"/>
    </g>

    <rect x="540" y="630" width="392" height="14" rx="7" fill="url(#road)"/>

    <g>
      <rect x="540" y="476" width="58" height="42" rx="6" fill="#f59e0b"/>
      <rect x="606" y="476" width="58" height="42" rx="6" fill="#fbbf24"/>
      <rect x="672" y="476" width="58" height="42" rx="6" fill="#f59e0b"/>
      <rect x="738" y="476" width="58" height="42" rx="6" fill="#fbbf24"/>
      <rect x="804" y="476" width="58" height="42" rx="6" fill="#f59e0b"/>
    </g>
  </g>

  <g fill="#dbeafe" font-family="Manrope, Arial, sans-serif" font-size="30" font-weight="700">
    <text x="110" y="120">Flow Logistics</text>
  </g>
  <g fill="#bfdbfe" font-family="Manrope, Arial, sans-serif" font-size="20">
    <text x="110" y="156">Stock • Transport • Livraison • Visibilite</text>
  </g>
</svg>
